name: Windows products

on:
  # agent/** matches nested branches such as agent/name/topic. agent/* does not:
  # GitHub's single star stops at a slash.
  push:
    branches:
      - main
      - 'agent/**'
  pull_request:
    branches:
      - main
      - 'agent/**'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Pull requests supersede themselves. Pushes to main and integration branches
  # finish so a later commit does not drop an in-flight verification.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  verify-and-package:
    runs-on: windows-2022
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13.15'
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          # Adoptium lists this JDK as 21.0.12+8.0.LTS. The product pin 21.0.12+8
          # does not match that catalog id, and setup-java then fails the job
          # before pytest, the helper, or Electron run.
          java-version: '21.0.12+8.0.LTS'
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.400'
      - name: Install locked build dependencies
        run: |
          npm ci
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          node node_modules/electron/install.js
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          npm --prefix frontend ci
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python -m pip install -r backend/requirements.txt -c packaging/python-runtime-constraints.txt -r backend/requirements-dev.txt pip-audit
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          New-Item -ItemType Directory -Force packaging/build | Out-Null
      - name: Install pinned ffmpeg and put it on PATH
        run: |
          $ProgressPreference = 'SilentlyContinue'
          $lock = Get-Content -Raw packaging/runtime-lock.json | ConvertFrom-Json
          $record = $lock.ffmpeg
          $zip = Join-Path $env:RUNNER_TEMP $record.filename
          Invoke-WebRequest -Uri $record.url -OutFile $zip -UseBasicParsing -Headers @{ 'User-Agent' = 'RedLotus-Packaging/0.4.1' }
          $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $zip).Hash.ToLowerInvariant()
          if ($hash -ne $record.sha256) { throw "ffmpeg sha256 mismatch: $hash" }
          $dest = Join-Path $env:RUNNER_TEMP 'ffmpeg-essentials'
          if (Test-Path -LiteralPath $dest) { Remove-Item -LiteralPath $dest -Recurse -Force }
          New-Item -ItemType Directory -Force -Path $dest | Out-Null
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          [System.IO.Compression.ZipFile]::ExtractToDirectory($zip, $dest)
          $bin = Get-ChildItem -LiteralPath $dest -Recurse -Filter ffmpeg.exe | Select-Object -First 1
          if (-not $bin) { throw 'pinned ffmpeg archive did not contain ffmpeg.exe' }
          Add-Content -Path $env:GITHUB_PATH -Value $bin.DirectoryName
          "WALKMAN_BRIDGE_FFMPEG=$($bin.FullName)" | Add-Content -Path $env:GITHUB_ENV
          & $bin.FullName -version
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Backend, browser logic and broker tests
        run: |
          python -m pytest backend/tests -q -p no:cacheprovider -rs
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python packaging/test_stage.py
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          node --test frontend/src/*.test.js (Get-ChildItem frontend/tests/*.test.mjs -Exclude walkman-smoke.test.mjs) electron/*.test.cjs packaging/*.test.cjs
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Native helper tests and self-contained publish
        run: |
          dotnet run --project scanner-helper/ScannerHelper.Tests/ScannerHelper.Tests.csproj -c Release
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          dotnet publish scanner-helper/ScannerHelper/ScannerHelper.csproj -c Release -r win-x64 --self-contained true -o scanner-helper/artifacts/win-x64
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Build frontend for Electron smoke
        run: |
          npm --prefix frontend run build
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          if (-not (Test-Path -LiteralPath frontend/dist/index.html)) { throw 'frontend/dist/index.html missing' }
      - name: Electron headless smoke and DSP self-test
        run: |
          Remove-Item Env:ELECTRON_RUN_AS_NODE -ErrorAction SilentlyContinue
          $ElectronPath = Join-Path $PWD 'node_modules/electron/dist/electron.exe'
          if (-not (Test-Path -LiteralPath $ElectronPath)) { throw "Electron binary missing: $ElectronPath" }
          foreach ($Harness in @(
            'frontend/tests/dsp-offline.cjs',
            'frontend/tests/renderer-smoke.cjs',
            'frontend/tests/media-import-smoke.cjs',
            'frontend/tests/management-smoke.cjs',
            'frontend/tests/resize-smoke.cjs',
            'electron/tests/lifecycle.electron.cjs'
          )) {
            if (-not (Test-Path -LiteralPath $Harness)) { throw "Electron harness missing: $Harness" }
            $Acceptance = Start-Process -FilePath $ElectronPath -ArgumentList $Harness -WorkingDirectory $PWD -WindowStyle Hidden -Wait -PassThru
            if ($null -eq $Acceptance -or $Acceptance.ExitCode -ne 0) {
              throw "Electron smoke failed: $Harness (exit $($Acceptance.ExitCode))"
            }
            Write-Host "PASS $Harness"
          }
      - name: Build and test the real headless Java engine
        run: |
          python packaging/provision-engine.py
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          # Quote -D so PowerShell does not treat it as its own parameter.
          mvn -B "-Dproject.build.sourceEncoding=UTF-8" -f .ci/jsymphonic/pom.xml package
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          New-Item -ItemType Directory -Force backend/vendor | Out-Null
          $Jar = Get-ChildItem .ci/jsymphonic/target/*-jar-with-dependencies.jar | Select-Object -First 1
          if (-not $Jar) { throw 'Headless engine artifact is missing' }
          Copy-Item -LiteralPath $Jar.FullName -Destination backend/vendor/jsymphonic.jar
      - name: ffmpeg and Java backend tests
        run: |
          $ffmpeg = $env:WALKMAN_BRIDGE_FFMPEG
          if (-not $ffmpeg) { $ffmpeg = (Get-Command ffmpeg -ErrorAction Stop).Source }
          $java = Join-Path $env:JAVA_HOME 'bin/java.exe'
          if (-not (Test-Path -LiteralPath $ffmpeg)) { throw "ffmpeg missing: $ffmpeg" }
          if (-not (Test-Path -LiteralPath $java)) { throw "java runtime missing: $java" }
          $env:WALKMAN_BRIDGE_FFMPEG = $ffmpeg
          $env:WALKMAN_BRIDGE_JAVA = $java
          $env:NIGHTOPS_REAL_MOCK = '1'
          Write-Host "Using ffmpeg $ffmpeg"
          Write-Host "Using java $java"
          & $ffmpeg -version
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          & $java -version
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python -m pytest backend/tests/test_analysis.py backend/tests/test_metadata.py backend/tests/test_real_mock.py backend/tests/test_metadata_device_roundtrip.py -q -p no:cacheprovider -rs
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Audit runtime dependencies
        run: |
          npm audit --audit-level=high
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          npm --prefix frontend audit --audit-level=high
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python -m pip_audit -r packaging/python-runtime-constraints.txt --no-deps --disable-pip --format json --output packaging/build/runtime-audit.json
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Build both versioned installers
        run: |
          ./packaging/build-products.ps1 -Product all -Python (Get-Command python).Source -JdkHome $env:JAVA_HOME -JSymphonicSource "$PWD/.ci/jsymphonic"
      - name: Verify packaged app archives
        run: |
          node packaging/verify-asar.cjs
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Real ffmpeg and Java API roundtrip on a temporary mock volume
        run: |
          python packaging/probe-resources.py dist_electron/bridge/win-unpacked/resources --output packaging/build/bridge-resources-probe.json
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python packaging/probe-resources.py dist_electron/player/win-unpacked/resources --output packaging/build/player-resources-probe.json
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $env:NIGHTOPS_REAL_MOCK = '1'
          $env:WALKMAN_BRIDGE_JAVA = "$env:JAVA_HOME/bin/java.exe"
          $env:WALKMAN_BRIDGE_FFMPEG = "$PWD/packaging/build/redlotus/bridge/ffmpeg/ffmpeg.exe"
          if (-not (Test-Path -LiteralPath $env:WALKMAN_BRIDGE_FFMPEG)) { throw "staged ffmpeg missing: $env:WALKMAN_BRIDGE_FFMPEG" }
          if (-not (Test-Path -LiteralPath $env:WALKMAN_BRIDGE_JAVA)) { throw "staged java missing: $env:WALKMAN_BRIDGE_JAVA" }
          New-Item -ItemType Directory -Force deno | Out-Null
          Copy-Item -LiteralPath packaging/build/redlotus/player/deno/deno.exe -Destination deno/deno.exe
          python -m pytest backend/tests/test_real_mock.py backend/tests/test_metadata.py backend/tests/test_metadata_device_roundtrip.py backend/tests/test_analysis.py backend/tests/test_link_import.py -q -p no:cacheprovider -rs
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Install, smoke and uninstall both products
        run: |
          $Version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          ./packaging/smoke-install.ps1 -Product bridge -Installer "dist_electron/bridge/Walkman-Bridge-Setup-$Version-x64.exe"
          ./packaging/smoke-install.ps1 -Product player -Installer "dist_electron/player/Red-Lotus-Player-Setup-$Version-x64.exe"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: red-lotus-windows-verification
          if-no-files-found: warn
          retention-days: 14
          path: |
            dist_electron/*/*Setup*.exe
            dist_electron/*/SHA256SUMS.txt
            packaging/build/runtime-audit.json
            packaging/build/*-resources-probe.json
            packaging/build/redlotus/*/runtime-manifest.json
            packaging/build/install-smoke/*/result.json
            packaging/build/install-smoke/*/local-data/*/redlotus.log
            packaging/build/electron-lifecycle-acceptance/proof.json
            packaging/build/asar-proof.json
            frontend/test-output/*.json
            frontend/test-output/*.png
            frontend/test-output/audio/*.json
            frontend/test-output/audio/*.wav
            frontend/test-output/media-import/*.json
            frontend/test-output/media-import/*.png
            frontend/test-output/management/*.json
            frontend/test-output/management/*.png
            frontend/test-output/resize*/**/*
            packaging/build/management-upgrade/*.json
            packaging/build/media-upgrade/*.json

  # hashFiles() is rejected on jobs.<job_id>.if. Record it after checkout, then
  # skip headless-smoke at job level when the script is absent.
  headless-smoke-present:
    runs-on: windows-2022
    timeout-minutes: 5
    outputs:
      present: ${{ steps.mark.outputs.present }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: mark
        name: Check headless smoke script
        if: hashFiles('frontend/tests/walkman-smoke.test.mjs') != ''
        shell: pwsh
        run: echo "present=true" >> $env:GITHUB_OUTPUT

  headless-smoke:
    needs: headless-smoke-present
    if: needs.headless-smoke-present.outputs.present == 'true'
    runs-on: windows-2022
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json
      - name: Run headless smoke tests
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          $Smoke = 'frontend/tests/walkman-smoke.test.mjs'
          $LogDir = 'packaging/build/headless-smoke'
          New-Item -ItemType Directory -Force -Path $LogDir | Out-Null
          $Log = Join-Path $LogDir 'output.log'
          npm --prefix frontend ci *> $Log
          if ($LASTEXITCODE) {
            Get-Content -LiteralPath $Log
            exit $LASTEXITCODE
          }
          node --test $Smoke *>> $Log
          $Code = $LASTEXITCODE
          Get-Content -LiteralPath $Log
          exit $Code
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: windows-headless-smoke
          if-no-files-found: warn
          retention-days: 14
          path: packaging/build/headless-smoke/**

  # Same Electron matrix as `npm run test:zoom-matrix` on Linux. The hosted
  # Windows desktop is 1024x768, which clamps the 1140/1380/1920 cells, so the
  # job raises it to a supported 1920x1080 mode before Electron starts.
  # timeout-minutes stays above the wrapper in frontend/tests/zoom-matrix-budget.cjs
  # (harness limit + 60s). Order: harness < wrapper < this job.
  zoom-matrix:
    runs-on: windows-2022
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json
      - name: Install locked dependencies
        run: |
          npm ci
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          node node_modules/electron/install.js
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          npm --prefix frontend ci
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Set display resolution for the zoom matrix
        shell: powershell
        run: Set-DisplayResolution -Width 1920 -Height 1080 -Force
      - name: Run zoom matrix
        run: |
          Remove-Item Env:ELECTRON_RUN_AS_NODE -ErrorAction SilentlyContinue
          npm run test:zoom-matrix
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: windows-zoom-matrix
          if-no-files-found: warn
          retention-days: 14
          path: |
            frontend/test-output/zoom-matrix/report.json
            !frontend/test-output/zoom-matrix/profile/**

  # The Windows desktop cannot fit 800x1200, so this job runs the same matrix
  # on a taller xvfb screen. timeout-minutes matches zoom-matrix-budget.cjs:
  # harness < wrapper < this job. Workflow permissions stay contents: read.
  zoom-matrix-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json
      - name: Install Electron libraries and xvfb
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libnss3 libgbm1 libdrm2 libxkbcommon0 libxcomposite1 libxdamage1 libxfixes3 libxrandr2 libxshmfence1 libxss1 libxtst6
          pkgs=""
          for spec in \
            "libgtk-3-0t64|libgtk-3-0" \
            "libasound2t64|libasound2" \
            "libatk-bridge2.0-0t64|libatk-bridge2.0-0" \
            "libatk1.0-0t64|libatk1.0-0" \
            "libcups2t64|libcups2"
          do
            preferred="${spec%%|*}"
            fallback="${spec#*|}"
            if apt-cache show "$preferred" >/dev/null 2>&1; then pkgs="$pkgs $preferred"
            else pkgs="$pkgs $fallback"
            fi
          done
          sudo apt-get install -y $pkgs
      - name: Install locked dependencies
        run: |
          npm ci
          node node_modules/electron/install.js
          npm --prefix frontend ci
      - name: Enable the Electron sandbox helper
        run: |
          # GitHub's Ubuntu image blocks unprivileged user namespaces, so Electron
          # uses chrome-sandbox and aborts unless that helper is setuid root.
          sandbox="node_modules/electron/dist/chrome-sandbox"
          sudo chown root:root "$sandbox"
          sudo chmod 4755 "$sandbox"
      - name: Run zoom matrix
        env:
          ZOOM_MATRIX_DISPLAY_READY: '1'
          ZOOM_MATRIX_FORBID_NOT_RUN: '1'
        run: xvfb-run -a -s "-screen 0 1920x1440x24" npm run test:zoom-matrix
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: linux-zoom-matrix
          if-no-files-found: warn
          retention-days: 14
          path: |
            frontend/test-output/zoom-matrix/report.json
            !frontend/test-output/zoom-matrix/profile/**
